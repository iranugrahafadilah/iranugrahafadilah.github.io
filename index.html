<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>CYBER EV ENGINE - HUD & TELEMETRY</title>
  <meta name="theme-color" content="#030712">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 128 128'><rect width='128' height='128' rx='28' fill='%23030712'/><circle cx='64' cy='64' r='46' fill='none' stroke='rgba(6,182,212,0.2)' stroke-width='6'/><path d='M26 84 A 44 44 0 0 1 102 84' fill='none' stroke='%2306b6d4' stroke-width='8' stroke-linecap='round'/><path d='M64 28 L64 64 L86 64' stroke='%23ef4444' stroke-width='6' stroke-linecap='round'/></svg>">

  <script>
    (function injectManifest() {
      const iconSvg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128"><rect width="128" height="128" rx="28" fill="#030712"/><circle cx="64" cy="64" r="46" fill="none" stroke="rgba(6, 182, 212, 0.2)" stroke-width="6"/><path d="M26 84 A 44 44 0 0 1 102 84" fill="none" stroke="#06b6d4" stroke-width="8" stroke-linecap="round"/><path d="M64 28 L64 64 L86 64" stroke="#ef4444" stroke-width="6" stroke-linecap="round"/><circle cx="64" cy="64" r="5" fill="#f8fafc"/></svg>`;
      const iconUrl = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(iconSvg);
      const manifestData = {
        name: "CYBER EV ENGINE & TELEMETRY",
        short_name: "CyberEV",
        start_url: window.location.href,
        display: "standalone",
        background_color: "#030712",
        theme_color: "#030712",
        orientation: "portrait",
        icons: [{ src: iconUrl, sizes: "192x192 512x512", type: "image/svg+xml", purpose: "any maskable" }]
      };
      const blob = new Blob([JSON.stringify(manifestData)], { type: 'application/json' });
      const manifestLink = document.createElement('link');
      manifestLink.rel = 'manifest';
      manifestLink.href = URL.createObjectURL(blob);
      document.head.appendChild(manifestLink);
    })();
  </script>

  <style>
    :root {
      --bg: #030712;
      --cyan: #06b6d4;
      --cyan-glow: rgba(6, 182, 212, 0.45);
      --red: #ef4444;
      --red-glow: rgba(239, 68, 68, 0.45);
      --amber: #f59e0b;
      --green: #10b981;
      --purple: #a855f7;
      --surface: rgba(15, 23, 42, 0.7);
      --border: rgba(56, 189, 248, 0.15);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
    body {
      background: var(--bg);
      background-image: 
        radial-gradient(ellipse 80% 50% at 50% -20%, rgba(6, 182, 212, 0.15), transparent),
        linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
      background-size: 100% 100%, 30px 30px, 30px 30px;
      color: #f1f5f9;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 12px 14px 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Orbitron", sans-serif;
    }

    .hud-container { width: 100%; max-width: 460px; display: flex; flex-direction: column; gap: 10px; position: relative; }
    .hud-header { display: flex; justify-content: space-between; align-items: center; padding: 0 4px; }
    .hud-brand { display: flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 800; letter-spacing: 1.5px; color: #94a3b8; }
    
    .version-tag {
      background: rgba(168, 85, 247, 0.15);
      color: var(--purple);
      border: 1px solid rgba(168, 85, 247, 0.3);
      padding: 2px 6px; border-radius: 6px; font-size: 9px; font-weight: 800; letter-spacing: 0.5px;
    }
    .status-dot { width: 7px; height: 7px; border-radius: 50%; background: #475569; transition: background 0.3s; }
    .status-dot.active { background: var(--green); box-shadow: 0 0 8px var(--green); }
    .status-dot.warn { background: var(--amber); box-shadow: 0 0 8px var(--amber); }

    .header-actions { display: flex; gap: 6px; }
    .icon-chip {
      background: var(--surface); border: 1px solid var(--border); color: #94a3b8;
      padding: 5px 9px; border-radius: 8px; font-size: 10px; font-weight: 700; letter-spacing: 0.5px;
      cursor: pointer; backdrop-filter: blur(6px); transition: all 0.2s;
    }
    .icon-chip:active { transform: scale(0.96); border-color: var(--cyan); color: #fff; }

    .hud-gauge {
      position: relative; background: radial-gradient(circle at 50% 50%, rgba(15, 23, 42, 0.85) 0%, rgba(3, 7, 18, 0.95) 100%);
      border: 1px solid var(--border); border-radius: 20px; padding: 16px 14px 14px;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.8), inset 0 0 25px rgba(6, 182, 212, 0.04);
      overflow: hidden;
    }
    .gauge-svg { width: 220px; height: 110px; margin-bottom: -15px; }
    .gauge-bg { fill: none; stroke: rgba(255, 255, 255, 0.05); stroke-width: 8; stroke-linecap: round; }
    .gauge-fill {
      fill: none; stroke: var(--cyan); stroke-width: 8; stroke-linecap: round;
      stroke-dasharray: 283; stroke-dashoffset: 283; transition: stroke-dashoffset 0.1s ease-out, stroke 0.3s;
      filter: drop-shadow(0 0 6px var(--cyan-glow));
    }
    .speed-wrapper { position: relative; text-align: center; margin-top: -55px; }
    .speed-val {
      font-size: 72px; font-weight: 900; line-height: 0.95; font-variant-numeric: tabular-nums;
      background: linear-gradient(180deg, #ffffff 40%, #94a3b8 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; letter-spacing: -2px;
    }
    .speed-unit { font-size: 10px; font-weight: 800; color: #64748b; letter-spacing: 2px; margin-top: 2px; }

    .hud-state {
      margin-top: 10px; padding: 4px 14px; border-radius: 999px; font-size: 10px; font-weight: 800;
      letter-spacing: 1.5px; text-transform: uppercase; display: inline-flex; align-items: center; gap: 6px; transition: all 0.2s;
    }
    .state-idle { background: rgba(148, 163, 184, 0.1); color: #94a3b8; border: 1px solid rgba(148, 163, 184, 0.2); }
    .state-accel { background: rgba(6, 182, 212, 0.15); color: #38bdf8; border: 1px solid var(--cyan); box-shadow: 0 0 12px var(--cyan-glow); }
    .state-cruise { background: rgba(168, 85, 247, 0.15); color: #c084fc; border: 1px solid var(--purple); box-shadow: 0 0 12px rgba(168,85,247,0.4); }
    .state-enginebrake { background: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid var(--red); box-shadow: 0 0 12px var(--red-glow); animation: brakeGlow 0.8s infinite alternate; }
    @keyframes brakeGlow { 0% { opacity: 0.8; } 100% { opacity: 1; transform: scale(1.02); } }

    .graph-card {
      background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 12px;
      backdrop-filter: blur(10px); display: flex; flex-direction: column; gap: 8px; box-shadow: 0 6px 20px rgba(0,0,0,0.5);
    }
    .graph-header { display: flex; justify-content: space-between; align-items: center; font-size: 11px; font-weight: 800; letter-spacing: 1px; color: #cbd5e1; }
    .graph-legend { display: flex; gap: 10px; flex-wrap: wrap; font-size: 9px; font-weight: 700; padding: 2px 0; }
    .legend-item { display: flex; align-items: center; gap: 4px; }
    .legend-box { width: 9px; height: 9px; border-radius: 2px; }

    #telemetryCanvas { width: 100%; height: 150px; background: rgba(3, 7, 18, 0.95); border: 1px solid rgba(56, 189, 248, 0.12); border-radius: 10px; display: block; }

    .telemetry-metrics-bar { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; text-align: center; }
    .metric-box { background: rgba(15, 23, 42, 0.6); border: 1px solid rgba(255,255,255,0.05); border-radius: 8px; padding: 5px 2px; }
    .metric-title { font-size: 8px; color: #64748b; font-weight: 700; text-transform: uppercase; }
    .metric-val { font-size: 11px; font-weight: 900; font-variant-numeric: tabular-nums; }

    .preset-selector { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 10px 12px; display: flex; flex-direction: column; gap: 4px; }
    select { width: 100%; background: rgba(3, 7, 18, 0.7); border: 1px solid var(--border); color: #38bdf8; padding: 8px 10px; border-radius: 8px; font-size: 12px; font-weight: 700; outline: none; cursor: pointer; }

    .ignition-btn {
      width: 100%; background: linear-gradient(135deg, rgba(239, 68, 68, 0.15), rgba(185, 28, 28, 0.3));
      border: 1px solid var(--red); color: #fca5a5; padding: 14px; border-radius: 16px; font-size: 13px; font-weight: 900;
      letter-spacing: 2px; text-transform: uppercase; cursor: pointer; transition: all 0.25s; display: flex; align-items: center; justify-content: center; gap: 10px;
    }
    .ignition-btn.active { background: linear-gradient(135deg, rgba(6, 182, 212, 0.2), rgba(16, 185, 129, 0.3)); border: 1px solid var(--cyan); color: #a5f3fc; box-shadow: 0 0 25px var(--cyan-glow); }
    
    .manual-test-box { display: none; flex-direction: column; gap: 6px; background: rgba(15, 23, 42, 0.5); border: 1px dashed #334155; padding: 8px 12px; border-radius: 10px; font-size: 11px; }
    input[type="range"] { width: 100%; accent-color: var(--cyan); }
    .hud-footer { width: 100%; display: flex; justify-content: space-between; align-items: center; font-size: 9px; color: #475569; padding: 4px 6px 0; letter-spacing: 0.5px; }
  </style>
</head>
<body>

<div class="hud-container">
  <div class="hud-header">
    <div class="hud-brand">
      <span class="status-dot" id="gpsDot"></span>
      <span id="gpsLabel">GPS READY</span>
      <span class="version-tag">v3.4 PHYSICS</span>
    </div>
    <div class="header-actions">
      <button class="icon-chip" id="btnTare">TARE STANG</button>
      <button class="icon-chip" id="btnWake">WAKE: OFF</button>
      <button class="icon-chip" id="btnTestMode">SIM</button>
    </div>
  </div>

  <div class="hud-gauge">
    <svg class="gauge-svg" viewBox="0 0 200 110">
      <path class="gauge-bg" d="M 20 100 A 80 80 0 0 1 180 100" />
      <path class="gauge-fill" id="gaugeFill" d="M 20 100 A 80 80 0 0 1 180 100" />
    </svg>
    <div class="speed-wrapper">
      <div class="speed-val" id="speedDisp">0</div>
      <div class="speed-unit">KM/H • MAX 40</div>
    </div>
    <div class="hud-state state-idle" id="stateBadge">IDLE STANDBY</div>
  </div>

  <div class="graph-card">
    <div class="graph-header">
      <span>📊 DYNAMIC TELEMETRY LOG</span>
      <span id="logCounter" style="color:var(--cyan); font-size:10px;">0 pts</span>
    </div>
    <div class="graph-legend">
      <div class="legend-item"><span class="legend-box" style="background:#06b6d4;"></span><span>Speed</span></div>
      <div class="legend-item"><span class="legend-box" style="background:#f59e0b;"></span><span>Gyro</span></div>
      <div class="legend-item"><span class="legend-box" style="background:#a855f7;"></span><span>Sound Pitch</span></div>
      <div class="legend-item"><span class="legend-box" style="background:#ef4444;"></span><span>Filter/Volume</span></div>
    </div>
    <canvas id="telemetryCanvas" width="420" height="150"></canvas>
    <div class="telemetry-metrics-bar">
      <div class="metric-box"><div class="metric-title">SPEED</div><div class="metric-val" id="metricSpeed" style="color:#06b6d4;">0.0</div></div>
      <div class="metric-box"><div class="metric-title">GYRO PITCH</div><div class="metric-val" id="metricPitch" style="color:#f59e0b;">0.0°</div></div>
      <div class="metric-box"><div class="metric-title">SOUND FREQ</div><div class="metric-val" id="metricFreq" style="color:#a855f7;">0 Hz</div></div>
      <div class="metric-box"><div class="metric-title">FILTER / VOL</div><div class="metric-val" id="metricFilter" style="color:#ef4444;">0 Hz</div></div>
    </div>
  </div>

  <div class="preset-selector">
    <select id="exhaustPreset">
      <option value="superbike" selected>🔥 Inline-4 1000cc Screamer (Moge)</option>
      <option value="crossplane">⚡ R1 Crossplane Big-Bang (Galak)</option>
      <option value="twostroke_race">💨 2-Tak 150cc Kalajengking Garing</option>
      <option value="beatmberr">💥 Matic Beat Mberr Bobokan (Decel Pop)</option>
      <option value="single_thump">🚜 Single Cylinder 400cc Thumper</option>
      <option value="harley_vtwin">🦅 Harley V-Twin 1800cc (Potato)</option>
      <option value="matic_std">🛵 Skutik Matic Standar CVT</option>
    </select>
  </div>

  <div class="manual-test-box" id="testBox">
    <div style="display:flex; justify-content:space-between;">
      <span>Manual Speed: <b id="manualVal">0</b> km/h</span>
      <span>Tilt Gyro: <b id="tiltVal">0°</b></span>
    </div>
    <input type="range" id="manualSlider" min="0" max="40" step="0.5" value="0">
    <input type="range" id="manualTilt" min="-25" max="25" step="1" value="0">
  </div>

  <button class="ignition-btn" id="btnEngine">
    <span style="font-size:16px;">⚡</span> START ENGINE
  </button>
</div>

<div class="hud-footer">
  <span>CYBER EV SOUND & TELEMETRY</span>
  <span>BUILD v3.4.0 (PHYSICS UPDATE)</span>
</div>

<script>
  if ('serviceWorker' in navigator) {
    const swScript = `self.addEventListener('install', (e) => self.skipWaiting()); self.addEventListener('activate', (e) => clients.claim()); self.addEventListener('fetch', (e) => e.respondWith(fetch(e.request).catch(() => new Response('Offline'))));`;
    const swBlob = new Blob([swScript], { type: 'application/javascript' });
    navigator.serviceWorker.register(URL.createObjectURL(swBlob)).catch(() => {});
  }

  let isEngineRunning = false;
  let audioCtx, oscMain, oscHarmonic, oscSub, waveShaperNode, filterLowPass, filterResonance, mainGainNode, noiseNode, noiseGain;
  let currentSpeed = 0, targetSpeed = 0, lastSpeed = 0;
  let lastTimestamp = performance.now();
  let currentPitch = 0, zeroPitchOffset = 0;
  let isTestMode = false;

  let currentAudioFreq = 0, currentFilterFreq = 0, currentEngineState = 'IDLE';

  function makeDistortionCurve(amount = 22) {
    const k = amount, n_samples = 44100, curve = new Float32Array(n_samples), deg = Math.PI / 180;
    for (let i = 0; i < n_samples; ++i) {
      const x = (i * 2) / n_samples - 1;
      curve[i] = ((3 + k) * x * 20 * deg) / (Math.PI + k * Math.abs(x));
    }
    return curve;
  }

  function initAudio() {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    oscMain = audioCtx.createOscillator(); oscHarmonic = audioCtx.createOscillator(); oscSub = audioCtx.createOscillator();
    oscMain.type = 'sawtooth'; oscHarmonic.type = 'triangle'; oscSub.type = 'sawtooth';

    waveShaperNode = audioCtx.createWaveShaper(); waveShaperNode.curve = makeDistortionCurve(24); waveShaperNode.oversample = '4x';
    filterResonance = audioCtx.createBiquadFilter(); filterResonance.type = 'peaking'; filterResonance.frequency.value = 220; filterResonance.gain.value = 9; filterResonance.Q.value = 3.2;
    filterLowPass = audioCtx.createBiquadFilter(); filterLowPass.type = 'lowpass'; filterLowPass.frequency.value = 450; filterLowPass.Q.value = 4.0;

    const bufferSize = audioCtx.sampleRate * 2;
    const noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
    const output = noiseBuffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) output[i] = Math.random() * 2 - 1;

    noiseNode = audioCtx.createBufferSource(); noiseNode.buffer = noiseBuffer; noiseNode.loop = true;
    const noiseFilter = audioCtx.createBiquadFilter(); noiseFilter.type = 'bandpass'; noiseFilter.frequency.value = 650; noiseFilter.Q.value = 2.5;
    noiseGain = audioCtx.createGain(); noiseGain.gain.value = 0.04;
    
    noiseNode.connect(noiseFilter); noiseFilter.connect(noiseGain);
    mainGainNode = audioCtx.createGain(); mainGainNode.gain.value = 0.26;

    oscMain.connect(waveShaperNode); oscHarmonic.connect(waveShaperNode); oscSub.connect(filterResonance); noiseGain.connect(filterResonance);
    waveShaperNode.connect(filterResonance); filterResonance.connect(filterLowPass); filterLowPass.connect(mainGainNode); mainGainNode.connect(audioCtx.destination);
    
    oscMain.start(); oscHarmonic.start(); oscSub.start(); noiseNode.start();
  }

  function updateSound(speed, accel, pitch) {
    if (!audioCtx || !isEngineRunning) return;
    const preset = document.getElementById('exhaustPreset').value;
    const now = audioCtx.currentTime;
    const norm = Math.min(Math.max(speed / 40, 0), 1.2); // Cap at 1.2x (48kmh) for extra headroom
    
    let state = 'IDLE';
    const isDownhill = pitch <= -3.8;
    
    // PEMBARUAN LOGIKA FISIKA (v3.4)
    const isAccelerating = accel > 0.25; // Gas ditarik nyata
    const isDeceleratingHeavy = accel < -0.55; // Pengereman signifikan / gas tutup total

    if (speed < 1.0) {
      state = 'IDLE';
    } else if (isAccelerating) {
      state = 'ACCEL'; // Prioritas Utama: Digas berarti akselerasi (meski turunan)
    } else if (isDownhill && speed > 2.5) {
      state = 'ENGINE_BRAKE_DOWNHILL'; // Turunan & Tidak Digas
    } else if (isDeceleratingHeavy) {
      state = 'ENGINE_BRAKE_FLAT'; // Kecepatan turun banyak (ngerem)
    } else {
      state = 'CRUISE'; // Kecepatan stabil atau turun sedikit (TIDAK CUTOFF)
    }
    currentEngineState = state;

    // UI Updates
    const stateBadge = document.getElementById('stateBadge');
    stateBadge.className = 'hud-state';
    const gaugeFill = document.getElementById('gaugeFill');
    gaugeFill.style.strokeDashoffset = Math.max(0, 283 - (norm * 283));

    if (state === 'IDLE') {
      stateBadge.classList.add('state-idle'); stateBadge.innerText = 'IDLE STANDBY'; gaugeFill.style.stroke = 'var(--cyan)';
    } else if (state === 'ACCEL') {
      stateBadge.classList.add('state-accel'); stateBadge.innerText = '⚡ ACCELERATING'; gaugeFill.style.stroke = '#38bdf8';
    } else if (state === 'CRUISE') {
      stateBadge.classList.add('state-cruise'); stateBadge.innerText = 'CRUISING / STABIL'; gaugeFill.style.stroke = 'var(--purple)';
    } else if (state === 'ENGINE_BRAKE_DOWNHILL') {
      stateBadge.classList.add('state-enginebrake'); stateBadge.innerText = `⛰️ ENGINE BRAKE (${Math.abs(pitch).toFixed(1)}°)`; gaugeFill.style.stroke = 'var(--red)';
    } else {
      stateBadge.classList.add('state-enginebrake'); stateBadge.innerText = '⛔ ENGINE BRAKE'; gaugeFill.style.stroke = 'var(--red)';
    }

    let baseFreq = 42, harmRatio = 1.5, targetFilter = 500, targetGain = 0.26, resFreq = 220, decelPopChance = 0;
    
    // PEMBARUAN: Waktu Transisi Suara (Smoothing)
    let tConst = 0.1; 
    if (state === 'CRUISE') tConst = 0.4; // Transisi sangat smooth agar tidak kaget saat kecepatan konstan
    if (state === 'ACCEL') tConst = 0.08; // Transisi agresif saat ditarik gas

    switch (preset) {
      case 'superbike':
        baseFreq = 55 + (norm * 220); harmRatio = 2.0; resFreq = 380 + (norm * 600);
        if (state === 'ACCEL') {
          baseFreq *= 1.35; targetFilter = 2800 + (norm * 1400); targetGain = 0.38 + (norm * 0.1);
        } else if (state.startsWith('ENGINE_BRAKE')) {
          baseFreq *= 0.85; targetFilter = isDownhill ? 500 : 700; targetGain = 0.28; decelPopChance = isDownhill ? 0.35 : 0.15;
        } else { // CRUISE STABIL
          targetFilter = 1800 + (norm * 1200); targetGain = 0.30 + (norm * 0.08);
        }
        break;
      case 'crossplane':
        baseFreq = 44 + (norm * 180); harmRatio = 1.414; resFreq = 240 + (norm * 300);
        if (state === 'ACCEL') {
          baseFreq *= 1.3; targetFilter = 2200 + (norm * 1200); targetGain = 0.40 + (norm * 0.1);
        } else if (state.startsWith('ENGINE_BRAKE')) {
          baseFreq *= 0.88; targetFilter = isDownhill ? 350 : 500; targetGain = 0.32; decelPopChance = isDownhill ? 0.4 : 0.2;
        } else {
          targetFilter = 1500 + (norm * 800); targetGain = 0.32 + (norm * 0.06);
        }
        break;
      case 'twostroke_race':
        baseFreq = 70 + (norm * 240); harmRatio = 2.02; resFreq = 850 + (norm * 900);
        if (state === 'ACCEL') {
          baseFreq *= 1.38; targetFilter = 3800 + (norm * 1800); targetGain = 0.42 + (norm * 0.1);
        } else if (state.startsWith('ENGINE_BRAKE')) {
          baseFreq *= 0.82; targetFilter = isDownhill ? 550 : 800; targetGain = 0.28; decelPopChance = isDownhill ? 0.45 : 0.25;
        } else {
          targetFilter = 2200 + (norm * 1200); targetGain = 0.30 + (norm * 0.08);
        }
        break;
      case 'beatmberr':
        baseFreq = 42 + (norm * 125); harmRatio = 1.5; resFreq = 220 + (norm * 350);
        if (state === 'ACCEL') {
          baseFreq *= 1.28; targetFilter = 1600 + (norm * 1000); targetGain = 0.35 + (norm * 0.08);
        } else if (state.startsWith('ENGINE_BRAKE')) {
          baseFreq *= 0.85; targetFilter = isDownhill ? 300 : 450; targetGain = 0.32; decelPopChance = isDownhill ? 0.4 : 0.25;
        } else {
          targetFilter = 1000 + (norm * 600); targetGain = 0.28 + (norm * 0.06);
        }
        break;
      case 'single_thump':
        baseFreq = 34 + (norm * 120); harmRatio = 1.33; resFreq = 160 + (norm * 180);
        if (state === 'ACCEL') {
          baseFreq *= 1.25; targetFilter = 1500 + (norm * 900); targetGain = 0.42 + (norm * 0.1);
        } else if (state.startsWith('ENGINE_BRAKE')) {
          baseFreq *= 0.85; targetFilter = isDownhill ? 250 : 380; targetGain = 0.34; decelPopChance = isDownhill ? 0.35 : 0.15;
        } else {
          targetFilter = 900 + (norm * 500); targetGain = 0.32 + (norm * 0.06);
        }
        break;
      case 'harley_vtwin':
        baseFreq = 28 + (norm * 95); harmRatio = 1.25; resFreq = 120 + (norm * 150);
        if (state === 'ACCEL') {
          baseFreq *= 1.2; targetFilter = 1200 + (norm * 700); targetGain = 0.44 + (norm * 0.1);
        } else if (state.startsWith('ENGINE_BRAKE')) {
          baseFreq *= 0.85; targetFilter = 250; targetGain = 0.35; decelPopChance = 0.2;
        } else {
          targetFilter = 800 + (norm * 400); targetGain = 0.35 + (norm * 0.06);
        }
        break;
      default: // matic_std
        baseFreq = 36 + (norm * 90); harmRatio = 1.5; resFreq = 200;
        if (state === 'ACCEL') {
          targetFilter = 850 + (norm * 600); targetGain = 0.30;
        } else if (state.startsWith('ENGINE_BRAKE')) {
          targetFilter = 260; targetGain = 0.20;
        } else {
          targetFilter = 500 + (norm * 200); targetGain = 0.25;
        }
        break;
    }

    currentAudioFreq = baseFreq; currentFilterFreq = targetFilter;

    // Apply with Dynamic Time Constant for smoothness
    oscMain.frequency.setTargetAtTime(baseFreq, now, tConst);
    oscHarmonic.frequency.setTargetAtTime(baseFreq * harmRatio, now, tConst);
    oscSub.frequency.setTargetAtTime(baseFreq * 0.5, now, tConst);
    filterResonance.frequency.setTargetAtTime(resFreq, now, tConst);
    filterLowPass.frequency.setTargetAtTime(targetFilter, now, tConst);
    mainGainNode.gain.setTargetAtTime(targetGain, now, tConst);

    if (decelPopChance > 0 && Math.random() < decelPopChance) triggerDecelPop(now, preset);
  }

  let lastPopTime = 0;
  function triggerDecelPop(now, preset) {
    if (now - lastPopTime > 0.16) {
      lastPopTime = now;
      const popOsc = audioCtx.createOscillator(); const popGain = audioCtx.createGain();
      popOsc.type = preset === 'twostroke_race' ? 'sawtooth' : 'triangle';
      const startPitch = preset === 'twostroke_race' ? 240 : 130;
      popOsc.frequency.setValueAtTime(startPitch + Math.random() * 60, now);
      popOsc.frequency.exponentialRampToValueAtTime(35, now + 0.09);
      popGain.gain.setValueAtTime(0.42, now);
      popGain.gain.exponentialRampToValueAtTime(0.001, now + 0.09);
      popOsc.connect(popGain); popGain.connect(filterResonance);
      popOsc.start(now); popOsc.stop(now + 0.1);
    }
  }

  if (window.DeviceOrientationEvent) {
    window.addEventListener('deviceorientation', (e) => {
      let rawPitch = (e.beta !== null) ? e.beta : 0; currentPitch = rawPitch - zeroPitchOffset;
    });
  }

  document.getElementById('btnTare').addEventListener('click', () => {
    zeroPitchOffset = currentPitch + zeroPitchOffset; currentPitch = 0;
  });

  let watchId = null;
  function startGPS() {
    if ('geolocation' in navigator) {
      watchId = navigator.geolocation.watchPosition(
        (pos) => {
          document.getElementById('gpsDot').className = 'status-dot active'; document.getElementById('gpsLabel').innerText = 'GPS LOCKED';
          let speedKmh = (pos.coords.speed !== null && pos.coords.speed >= 0) ? pos.coords.speed * 3.6 : 0;
          if (!isTestMode) targetSpeed = Math.min(speedKmh, 50); // Capped higher for realism
        },
        () => { document.getElementById('gpsDot').className = 'status-dot warn'; document.getElementById('gpsLabel').innerText = 'GPS SEARCH'; },
        { enableHighAccuracy: true, maximumAge: 500, timeout: 3000 }
      );
    }
  }

  const canvas = document.getElementById('telemetryCanvas');
  const ctx = canvas.getContext('2d');
  const MAX_LOG_POINTS = 140; const telemetryHistory = [];
  let logSampleTimer = 0;

  function addTelemetryPoint(timestamp, speed, pitch, freq, filterVal, state) {
    telemetryHistory.push({ time: (timestamp / 1000).toFixed(2), speed: Number(speed.toFixed(1)), pitch: Number(pitch.toFixed(1)), freq: Math.round(freq), filter: Math.round(filterVal), state: state });
    if (telemetryHistory.length > MAX_LOG_POINTS) telemetryHistory.shift();
    document.getElementById('logCounter').innerText = `${telemetryHistory.length} pts`;
  }

  function renderGraph() {
    const w = canvas.width, h = canvas.height; ctx.clearRect(0, 0, w, h);
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.05)'; ctx.lineWidth = 1;
    for (let i = 1; i < 4; i++) { let y = (h / 4) * i; ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke(); }
    ctx.strokeStyle = 'rgba(245, 158, 11, 0.2)'; ctx.setLineDash([4, 4]); ctx.beginPath(); ctx.moveTo(0, h / 2); ctx.lineTo(w, h / 2); ctx.stroke(); ctx.setLineDash([]);
    if (telemetryHistory.length < 2) return;
    const stepX = w / (MAX_LOG_POINTS - 1), startOffset = (MAX_LOG_POINTS - telemetryHistory.length) * stepX;
    
    const getY_speed = (spd) => h - (Math.min(Math.max(spd, 0), 40) / 40) * (h - 10) - 5;
    const getY_pitch = (pt) => (h / 2) - (Math.min(Math.max(pt, -20), 20) / 20) * ((h / 2) - 8);
    const getY_freq = (frq) => h - (Math.min(Math.max(frq, 0), 450) / 450) * (h - 10) - 5;
    const getY_filter = (flt) => h - (Math.min(Math.max(flt, 0), 4000) / 4000) * (h - 10) - 5;

    const drawChannel = (color, lw, yFunc, valKey) => {
      ctx.strokeStyle = color; ctx.lineWidth = lw; ctx.beginPath();
      telemetryHistory.forEach((pt, i) => { const x = startOffset + i * stepX, y = yFunc(pt[valKey]); if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y); });
      ctx.stroke();
    };

    drawChannel('#ef4444', 1.2, getY_filter, 'filter');
    drawChannel('#a855f7', 1.8, getY_freq, 'freq');
    drawChannel('#f59e0b', 1.6, getY_pitch, 'pitch');
    drawChannel('#06b6d4', 2.5, getY_speed, 'speed');
  }

  function physicsLoop(now) {
    const dt = (now - lastTimestamp) / 1000; lastTimestamp = now;
    currentSpeed += (targetSpeed - currentSpeed) * Math.min(dt * 6.0, 1.0);
    const accel = dt > 0 ? ((currentSpeed - lastSpeed) / 3.6) / dt : 0;
    lastSpeed = currentSpeed;

    document.getElementById('speedDisp').innerText = Math.round(currentSpeed);
    updateSound(currentSpeed, accel, currentPitch);

    document.getElementById('metricSpeed').innerText = `${currentSpeed.toFixed(1)} km/h`;
    document.getElementById('metricPitch').innerText = `${currentPitch >= 0 ? '+' : ''}${currentPitch.toFixed(1)}°`;
    document.getElementById('metricFreq').innerText = `${Math.round(currentAudioFreq)} Hz`;
    document.getElementById('metricFilter').innerText = `${Math.round(currentFilterFreq)} Hz`;

    if (now - logSampleTimer > 100) { logSampleTimer = now; addTelemetryPoint(now, currentSpeed, currentPitch, currentAudioFreq, currentFilterFreq, currentEngineState); renderGraph(); }
    if (isEngineRunning) requestAnimationFrame(physicsLoop);
  }

  const btnEngine = document.getElementById('btnEngine');
  btnEngine.addEventListener('click', () => {
    if (!isEngineRunning) {
      if (!audioCtx) initAudio();
      audioCtx.resume(); isEngineRunning = true; btnEngine.innerHTML = '<span style="font-size:16px;">⏹</span> SHUTDOWN REACTOR'; btnEngine.classList.add('active');
      startGPS(); lastTimestamp = performance.now(); requestAnimationFrame(physicsLoop);
    } else {
      isEngineRunning = false; if (audioCtx) audioCtx.suspend();
      btnEngine.innerHTML = '<span style="font-size:16px;">⚡</span> START ENGINE'; btnEngine.classList.remove('active');
      document.getElementById('speedDisp').innerText = '0'; document.getElementById('gaugeFill').style.strokeDashoffset = 283;
      document.getElementById('stateBadge').className = 'hud-state state-idle'; document.getElementById('stateBadge').innerText = 'STANDBY';
      if (watchId) navigator.geolocation.clearWatch(watchId);
    }
  });

  document.getElementById('btnTestMode').addEventListener('click', () => {
    isTestMode = !isTestMode; document.getElementById('testBox').style.display = isTestMode ? 'flex' : 'none';
    document.getElementById('btnTestMode').style.borderColor = isTestMode ? 'var(--cyan)' : 'var(--border)'; document.getElementById('btnTestMode').style.color = isTestMode ? 'var(--cyan)' : '#94a3b8';
  });
  document.getElementById('manualSlider').addEventListener('input', (e) => { targetSpeed = parseFloat(e.target.value); document.getElementById('manualVal').innerText = targetSpeed.toFixed(1); });
  document.getElementById('manualTilt').addEventListener('input', (e) => { currentPitch = parseFloat(e.target.value); document.getElementById('tiltVal').innerText = `${currentPitch}°`; });

  let wakeLockObj = null;
  document.getElementById('btnWake').addEventListener('click', async () => {
    const btn = document.getElementById('btnWake');
    if ('wakeLock' in navigator) {
      if (!wakeLockObj) { try { wakeLockObj = await navigator.wakeLock.request('screen'); btn.innerText = 'WAKE: ON'; btn.style.color = 'var(--cyan)'; btn.style.borderColor = 'var(--cyan)'; } catch (err) {} }
      else { await wakeLockObj.release(); wakeLockObj = null; btn.innerText = 'WAKE: OFF'; btn.style.color = '#94a3b8'; btn.style.borderColor = 'var(--border)'; }
    }
  });
</script>
</body>
</html>
